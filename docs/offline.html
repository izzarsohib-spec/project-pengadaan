<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #f5f5f7; font: 18px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 440px; text-align: center; }
  img { height: 64px; margin-bottom: 18px; background: #fff; border-radius: 14px; padding: 8px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: #a4a4ae; margin: 0 0 22px; }
  button { font: inherit; font-weight: 700; padding: 12px 26px; border: 0; border-radius: 99px; background: #f5d547; color: #19191c; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="aset/logo-ray.png" alt="Logo PT. Ray Mitra Perkasa">
  <h1>Tidak ada koneksi internet</h1>
  <p>Data pengadaan diambil langsung dari server, jadi aplikasi perlu internet. Periksa sambungan Anda lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
