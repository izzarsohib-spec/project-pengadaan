<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sistem Belanja Chemical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --bg:#EDF1F6; --panel:#FFFFFF; --panel2:#EEF2F7; --stroke:#DCE3EC; --text:#0F172A; --muted:#5B6577; --accent:#2F7F79; --ok:#3F7F6B; --ok-bg:#E5F1EC; --warn:#9A7432; --warn-bg:#F7EFDC; --bad:#B0584F; --bad-bg:#F8E7E4; --info:#4B8F9E; --navy:#33475B; --head:"IBM Plex Sans", system-ui, sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; } button { cursor:pointer; }
  h1, h2, h3 { margin:0; letter-spacing:-.01em; font-family:var(--head); }
  .wrap { max-width:1320px; margin:0 auto; padding:18px 22px 64px; }
  .muted { color:var(--muted); } .r { text-align:right; } .neg { color:var(--bad); } .pos { color:var(--ok); } .num { font-variant-numeric:tabular-nums; } small { color:var(--muted); }
  [hidden] { display:none !important; }
  .kop { display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
  .kop h1 { font-size:clamp(1.2rem, 2.4vw, 1.8rem); } .kop .perusahaan { color:var(--accent); font-weight:700; letter-spacing:.14em; font-size:.95rem; }
  body.dalam .kop, body.dalam .tabs { display:none; } body.dalam { background:transparent; } body.dalam .wrap { padding-top:6px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; }
  .tabs button { flex:none; border:1px solid var(--stroke); background:#fff; border-radius:99px; padding:7px 14px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:12px 16px; margin-bottom:16px; }
  .bar select { width:auto; min-width:170px; font-weight:600; }
  .bar .langkah { flex:1 1 280px; font-size:.9rem; } .bar .langkah b { color:var(--accent); }
  .ph { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px; margin:4px 0 14px; } .ph h2 { font-size:1.4rem; } .ph .aks { display:flex; flex-wrap:wrap; gap:8px; }
  .card { background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 18px rgba(15,23,42,.05); }
  .card h3 { font-size:1.05rem; margin-bottom:10px; } .card > p:first-of-type { margin-top:0; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
  .kpi > div { background:#F4F7FB; border:1px solid var(--stroke); border-radius:14px; padding:12px 16px; } .kpi small { display:block; } .kpi b { display:block; font-size:1.3rem; margin:2px 0; } .kpi em { font-style:normal; font-size:.78rem; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:980px) { .grid2 { grid-template-columns:1fr; } }
  input, select, textarea { width:100%; background:#fff; border:1px solid #CBD5E1; border-radius:10px; padding:8px 11px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid rgba(47,127,121,.6); outline-offset:1px; }
  input[type=checkbox] { width:auto; }
  .btn, .cta { border:1px solid #CBD5E1; background:#fff; border-radius:10px; padding:8px 14px; } .btn:hover { border-color:var(--accent); color:var(--accent); }
  .cta { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; } .cta:hover { background:#26665F; border-color:#26665F; color:#fff; } .cta:disabled, .btn:disabled { opacity:.5; cursor:default; }
  .btn.mini { padding:3px 10px; font-size:.82rem; border-radius:8px; } .btn.bahaya:hover { border-color:var(--bad); color:var(--bad); }
  .chip { display:inline-block; border:1px solid var(--stroke); background:#fff; border-radius:99px; padding:4px 12px; font-size:.84rem; } button.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .lencana { display:inline-block; border-radius:99px; padding:2px 10px; font-size:.76rem; font-weight:600; background:var(--panel2); color:var(--muted); white-space:nowrap; }
  .lencana.ok { background:var(--ok-bg); color:var(--ok); } .lencana.warn { background:var(--warn-bg); color:var(--warn); } .lencana.bad { background:var(--bad-bg); color:var(--bad); } .lencana.info { background:#E1F0F4; color:#2E6E7C; }
  .subtabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tw { overflow-x:auto; } table.tbl { width:100%; border-collapse:collapse; font-size:.9rem; }
  .tbl th { background:var(--navy); color:#fff; text-align:left; font-weight:600; padding:8px 10px; white-space:nowrap; cursor:pointer; user-select:none; } .tbl th.r { text-align:right; }
  .tbl td { padding:8px 10px; border-bottom:1px solid #E5EAF1; vertical-align:top; } .tbl tbody tr:hover td { background:#F4F7FB; } .tbl tr.batal td { color:#9AA3B2; text-decoration:line-through; } .tbl tfoot td { font-weight:700; background:#F4F7FB; }
  .tbl select, .tbl input { padding:4px 8px; font-size:.88rem; } .tbl td input[type=number] { width:96px; text-align:right; }
  .cari { max-width:320px; margin-bottom:10px; }
  .peringatan { border-radius:12px; padding:10px 14px; margin-bottom:10px; background:var(--warn-bg); color:#6F5420; } .peringatan.bad { background:var(--bad-bg); color:#8A3B33; } .peringatan.ok { background:var(--ok-bg); color:#2D6350; }
  .peringatan ul { margin:4px 0 0; padding-left:20px; }
  .prog { height:12px; background:#E2E8F0; border-radius:99px; overflow:hidden; } .prog > i { display:block; height:100%; background:var(--accent); }
  .tren { display:grid; grid-template-columns:110px 1fr 130px; gap:6px 10px; align-items:center; font-size:.88rem; }
  .langkahs { display:flex; flex-wrap:wrap; gap:6px; } .langkahs span { padding:4px 10px; border-radius:8px; font-size:.78rem; background:var(--panel2); color:var(--muted); } .langkahs span.lalu { background:var(--ok-bg); color:var(--ok); } .langkahs span.kini { background:var(--accent); color:#fff; font-weight:600; }
  .toko { margin-bottom:14px; } .toko > h4 { margin:0 0 6px; font-size:.98rem; }
  details.kl { border:1px solid var(--stroke); border-radius:12px; padding:8px 14px; margin-bottom:8px; background:#fff; } details.kl summary { cursor:pointer; font-weight:600; }
  dialog { border:0; border-radius:18px; padding:0; width:min(560px, 94vw); box-shadow:0 20px 60px rgba(15,23,42,.35); } dialog::backdrop { background:rgba(15,23,42,.45); }
  .fm { padding:20px 22px; max-height:88vh; overflow:auto; } .fg { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; margin-top:12px; } .fg .w2 { grid-column:1 / -1; } @media (max-width:520px) { .fg { grid-template-columns:1fr; } }
  label.f { display:block; font-size:.8rem; color:var(--muted); margin-bottom:12px; } label.f > :is(input, select, textarea) { margin-top:4px; color:var(--text); } label.ck { display:flex; gap:8px; align-items:center; font-size:.9rem; color:var(--text); }
  .err { color:var(--bad); font-weight:600; min-height:1.2em; margin-top:4px; } .aks { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  #toast { position:fixed; right:16px; bottom:16px; z-index:50; display:flex; flex-direction:column; gap:8px; max-width:min(420px, 92vw); }
  #toast div { background:var(--navy); color:#fff; padding:10px 14px; border-radius:12px; box-shadow:0 8px 24px rgba(15,23,42,.3); } #toast div.bad { background:var(--bad); }
  #cetak { display:none; }
  .dok { font-family:"Times New Roman", serif; color:#000; font-size:12pt; line-height:1.4; } .dok img.kop { width:100%; margin-bottom:10px; } .dok h2 { text-align:center; font-size:14pt; margin:8px 0 2px; text-decoration:underline; } .dok .no { text-align:center; margin-bottom:12px; }
  .dok table { width:100%; border-collapse:collapse; margin:8px 0; font-size:11pt; } .dok th, .dok td { border:1px solid #000; padding:4px 6px; } .dok th { background:#eee; } .dok td.r, .dok th.r { text-align:right; }
  .dok .ttd { display:flex; justify-content:space-around; margin-top:28px; text-align:center; } .dok .ttd div { min-width:190px; } .dok .ttd .sp { height:70px; }
  .dok .hal { page-break-after:always; } .dok .hal:last-child { page-break-after:auto; } .dok .kv td { border:0; padding:1px 6px; }
  @media (max-width:860px) { .wrap { padding:12px 12px 64px; } .card { padding:14px; } .btn, .cta, input, select { min-height:44px; } .btn.mini { min-height:34px; } input, select, textarea { font-size:16px; } }
  @media print { body > :not(#cetak) { display:none !important; } #cetak { display:block !important; } body { background:#fff; } @page { size:A4; margin:14mm; } }
</style>

<body>
<div class="wrap">
  <header class="kop"><h1>SISTEM BELANJA &amp; DISTRIBUSI CHEMICAL</h1><div class="perusahaan">PT. RAY MITRA PERKASA</div></header>
  <nav class="tabs" id="tabs" aria-label="Halaman chemical"></nav>
  <div class="bar" id="bar"></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="cetak" class="dok"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  /* Data disimpan di peramban (localStorage) dulu; semua baca-tulis lewat muatDB / simpan supaya mudah dipindah ke Supabase nanti. */
  const KEY = 'chemical.v1';
  const STATUS = ['DRAFT', 'REKAP_PERMINTAAN', 'CEK_ANGGARAN', 'DIAJUKAN', 'DISETUJUI', 'BELANJA', 'DISTRIBUSI', 'SELESAI_KIRIM', 'DILAPORKAN', 'TUTUP'];
  const NAMA_ST = { DRAFT: 'Draft', REKAP_PERMINTAAN: 'Rekap permintaan', CEK_ANGGARAN: 'Cek anggaran', DIAJUKAN: 'Diajukan', DISETUJUI: 'Disetujui', BELANJA: 'Belanja', DISTRIBUSI: 'Distribusi', SELESAI_KIRIM: 'Selesai kirim', DILAPORKAN: 'Dilaporkan', TUTUP: 'Tutup' };
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const KAT_BIAYA = ['Bensin', 'Makan', 'Parkir', 'Tol', 'Oli / servis kendaraan', 'Ongkir / paket', 'Upah bongkar-muat', 'Lain-lain'];
  const SATUAN = ['liter', 'pcs', 'kg', 'dus', 'botol', 'galon', 'pak'];
  const ST_KIRIM = ['BELUM DIKIRIM', 'DALAM PENGIRIMAN', 'TERKIRIM', 'DITERIMA'];
  const ST_BELI = ['TERBELI', 'KURANG DARI RENCANA', 'TIDAK TERSEDIA', 'GANTI MEREK'];
  const HAL = [['dashboard', 'Beranda'], ['periode', 'Periode'], ['permintaan', 'Permintaan'], ['anggaran', 'Cek Anggaran'], ['pengajuan', 'Pengajuan'], ['belanja', 'Belanja'], ['pemisahan', 'Pemisahan'], ['pengiriman', 'Pengiriman'], ['biaya', 'Biaya Operasional'], ['laporan', 'Laporan'], ['master', 'Master Data'], ['pengaturan', 'Pengaturan']];

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rp = n => { n = Math.round(+n || 0); return (n < 0 ? '-' : '') + 'Rp' + Math.abs(n).toLocaleString('id-ID'); };
  const jml = n => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
  const hariIni = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const tglf = s => s ? new Date(s + 'T00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
  const jum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const rata2 = (a, b) => b ? a / b : 0;

  const kosong = () => ({
    v: 1, seq: {}, pilih: '', klien: [], barang: [], toko: [], periode: [], permintaan: [], cek: {}, pengajuan: {}, realisasi: [], biaya: [], alokasi: {},
    metodeBiaya: {}, biayaManual: {}, biayaKunci: {}, distribusi: [], stok: [], ba: {}, ceklis: {}, talangan: {},
    aturan: { ambangAnggaran: 90, ambangHarga: 10, pihak1: { nama: 'Shohib Izzar Muhammad', jabatan: 'Admin' }, pihak2: { nama: 'Ferry Atmadi, S.E', jabatan: 'Direktur Utama' }, nomorSurat: 0 }, log: []
  });
  let DB; const ui = { page: 'dashboard', sub: {} };
  function muatDB() {
    try { const s = localStorage.getItem(KEY); if (s) { const d = Object.assign(kosong(), JSON.parse(s)); d.aturan = Object.assign(kosong().aturan, d.aturan); return d; } } catch (e) { /* data rusak atau diblokir: mulai kosong */ }
    return kosong();
  }
  function simpan() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { galat('Penyimpanan peramban penuh atau diblokir. Unduh cadangan di halaman Pengaturan.'); } }
  function nid(pref, pad = 3) { DB.seq[pref] = (DB.seq[pref] || 0) + 1; return pref + '-' + String(DB.seq[pref]).padStart(pad, '0'); }

  /* ---------- pesan, dialog, tulis dengan log ---------- */
  function pesan(t, cls) { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; $('toast').appendChild(d); setTimeout(() => d.remove(), cls ? 7000 : 3500); }
  const info = t => pesan(t), galat = t => pesan(t, 'bad');
  const P = () => DB.periode.find(p => p.id === DB.pilih) || null;
  const lab = p => BULAN[p.bulan - 1] + ' ' + p.tahun;
  const si = p => STATUS.indexOf(p.status);
  const urutPeriode = () => DB.periode.slice().sort((a, b) => a.id < b.id ? -1 : 1);
  /* Semua perubahan lewat T: menolak bila periode TUTUP, mencatat log, menyimpan, menggambar ulang. Mengembalikan '' bila berhasil, pesan bila ditolak. */
  function T(aksi, tabel, rid, ring, fn, master) {
    const p = P();
    if (!master) {
      if (!p) return 'Buat atau pilih periode dulu di halaman Periode.';
      if (p.status === 'TUTUP') return `Periode ${lab(p)} sudah TUTUP dan hanya bisa dibaca. Buka kembali lewat halaman Periode bila perlu.`;
    }
    fn();
    DB.log.push({ w: new Date().toISOString(), u: 'Admin', aksi, tabel, id: rid, r: ring });
    if (DB.log.length > 3000) DB.log.splice(0, DB.log.length - 3000);
    simpan(); render(); return '';
  }
  const Y = (...a) => { const g = T(...a); if (g) galat(g); return g; };

  function fld(f, v) {
    const id = 'f_' + f.k, val = v ?? f.def ?? ''; let c;
    if (f.t === 'select') c = `<select id="${id}">${f.opt.map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(val) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`;
    else if (f.t === 'textarea') c = `<textarea id="${id}" rows="3">${esc(val)}</textarea>`;
    else if (f.t === 'check') return `<label class="f ck w2"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(f.l)}</label>`;
    else c = `<input id="${id}" type="${f.t || 'text'}" ${f.t === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(val)}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>`;
    return `<label class="f ${f.w ? 'w2' : ''}">${esc(f.l)}${f.req ? ' *' : ''}${c}${f.h ? `<small>${esc(f.h)}</small>` : ''}</label>`;
  }
  function form(judul, fields, nilai, simpanFn, o = {}) {
    const d = $('dlg');
    d.innerHTML = `<form class="fm"><h3>${judul}</h3>${o.info || ''}<div class="fg">${fields.map(f => fld(f, nilai[f.k])).join('')}</div><div class="err" id="fe"></div><div class="aks"><button type="button" class="btn" data-a="tutupdlg">Batal</button><button class="cta">${o.tombol || 'Simpan'}</button></div></form>`;
    d.querySelector('form').onsubmit = e => {
      e.preventDefault(); const v = {};
      for (const f of fields) {
        const el = $('f_' + f.k); let x = f.t === 'check' ? el.checked : el.value.trim();
        if (f.t === 'number') x = x === '' ? null : +x;
        if (f.req && (x === '' || x === null || (f.t === 'number' && isNaN(x)))) { $('fe').textContent = `Isi kolom "${f.l}" dulu.`; el.focus(); return; }
        v[f.k] = x;
      }
      const err = simpanFn(v); if (err) { $('fe').textContent = err; return; }
      d.close();
    };
    d.showModal();
  }

  /* ---------- tabel: cari, urut, ekspor ---------- */
  let tabelN = 0;
  function tabel(cols, rows, o = {}) {
    const id = 'tb' + (++tabelN);
    const head = cols.map((c, i) => `<th class="${c.r ? 'r' : ''}" data-i="${i}">${c.h}</th>`).join('');
    const body = rows.map(r => `<tr class="${o.cls ? o.cls(r) : ''}">${cols.map(c => `<td class="${c.r ? 'r num' : ''}" data-v="${esc(c.v ? c.v(r) : '')}">${c.f(r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">${o.kosong || 'Belum ada data.'}</td></tr>`;
    const foot = o.foot ? `<tfoot><tr>${o.foot.map((x, i) => `<td class="${cols[i] && cols[i].r ? 'r' : ''}">${x}</td>`).join('')}</tr></tfoot>` : '';
    return `${o.cari === false ? '' : `<input class="cari" data-cari="${id}" placeholder="Cari…" aria-label="Cari di tabel">`}<div class="tw" id="${id}"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>${o.ekspor ? `<p><button class="btn mini" data-a="csv" data-t="${id}" data-n="${esc(o.ekspor)}">Ekspor Excel (CSV)</button></p>` : ''}`;
  }
  function unduh(nama, isi, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([isi], { type: mime || 'text/plain' })); a.download = nama; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function csvTabel(tbl, nama) {
    const q = c => '"' + String(c).replace(/"/g, '""').replace(/\s+/g, ' ').trim() + '"';
    const baris = [...tbl.querySelectorAll('tr')].map(tr => [...tr.children].map(td => q(td.textContent)).join(';'));
    unduh(nama + '.csv', '﻿' + baris.join('\r\n'), 'text/csv;charset=utf-8');
  }
  function urutTabel(th) {
    const tb = th.closest('table'), i = +th.dataset.i, naik = th.dataset.o !== 'a';
    tb.querySelectorAll('th').forEach(x => delete x.dataset.o); th.dataset.o = naik ? 'a' : 'd';
    const body = tb.tBodies[0], baris = [...body.rows];
    const nilai = tr => { const td = tr.children[i]; return td ? (td.dataset.v || td.textContent).trim() : ''; };
    baris.sort((a, b) => { const x = nilai(a), y = nilai(b), nx = parseFloat(x), ny = parseFloat(y); const c = (!isNaN(nx) && !isNaN(ny) && /^-?[\d.]+$/.test(x) && /^-?[\d.]+$/.test(y)) ? nx - ny : x.localeCompare(y, 'id'); return naik ? c : -c; });
    baris.forEach(r => body.appendChild(r));
  }

  /* ---------- pencarian data ---------- */
  const kById = id => DB.klien.find(k => k.id === id), bById = id => DB.barang.find(b => b.id === id), tById = id => DB.toko.find(t => t.id === id);
  const kNama = id => { const k = kById(id); return k ? k.nama + (k.lokasi ? ' — ' + k.lokasi : '') : id || '—'; };
  const bNama = id => (bById(id) || {}).nama || id || '—';
  const tNama = id => (tById(id) || {}).nama || 'Belum ditentukan';
  const bSat = id => (bById(id) || {}).satuan || '';
  const hRef = id => (bById(id) || {}).harga_ref || 0;
  const reqP = per => DB.permintaan.filter(r => r.per === per && !r.batal);
  const realP = per => DB.realisasi.filter(r => r.per === per && !r.batal);
  const biayaP = per => DB.biaya.filter(b => b.per === per && !b.batal);
  const totReal = per => jum(realP(per), r => r.sub);
  const totOps = per => jum(biayaP(per), b => b.nom);
  const transferP = per => ((DB.pengajuan[per] || {}).transfer || {}).nominal || 0;
  const sisaDana = per => transferP(per) - totReal(per) - totOps(per);
  const beli = (per, brg) => jum(realP(per).filter(r => r.brg === brg), r => r.qty);
  const hargaRata = (per, brg) => { const l = realP(per).filter(r => r.brg === brg && r.qty > 0); const q = jum(l, r => r.qty); return q ? jum(l, r => r.sub) / q : hRef(brg); };
  const sortNama = (a, b) => String(a).localeCompare(String(b), 'id');

  /* ---------- cek anggaran ---------- */
  function cekAnggaran(per) {
    const m = new Map();
    for (const r of reqP(per)) { const e = m.get(r.kln) || { kln: r.kln, est: 0, n: 0 }; e.est += r.qty * hRef(r.brg); e.n++; m.set(r.kln, e); }
    return [...m.values()].map(e => {
      const k = kById(e.kln) || {}, ang = k.anggaran || 0;
      const st = e.est > ang ? 'KURANG' : (e.est >= ang * DB.aturan.ambangAnggaran / 100 ? 'HAMPIR HABIS' : 'CUKUP');
      const t = DB.cek[per + '|' + e.kln] || null;
      const tunda = !!(t && t.tindakan === 'tunda' && st === 'KURANG');
      const ok = !tunda && (st !== 'KURANG' || !!(t && (t.tindakan === 'tambah' || t.tindakan === 'lanjut') && t.alasan));
      return { ...e, ang, sel: ang - e.est, st, t, ok, tunda };
    }).sort((a, b) => sortNama(kNama(a.kln), kNama(b.kln)));
  }
  const totDiajukan = pg => pg ? jum(pg.items, i => i.qty * i.harga) : 0;
  const totSetuju = pg => pg ? jum(pg.items.filter(i => i.status === 'DISETUJUI'), i => i.qtyS * i.harga) : 0;
  const daftarBelanja = per => { const pg = DB.pengajuan[per]; return pg ? pg.items.filter(i => i.status === 'DISETUJUI' && i.qtyS > 0) : []; };
  function statusItem(per, it) {
    const l = realP(per).filter(r => r.brg === it.brg), q = jum(l, r => r.qty);
    if (q >= it.qtyS) return 'TERBELI'; if (q > 0) return 'KURANG DARI RENCANA';

  }

  /* ---------- alokasi barang per klien ---------- */
  function buatAlokasi(per, aturan) {
    const pg = DB.pengajuan[per]; if (!pg) return [];
    const masuk = new Set(pg.klien), rows = [];
    for (const brg of [...new Set(reqP(per).filter(r => masuk.has(r.kln)).map(r => r.brg))]) {
      const dem = new Map(); reqP(per).filter(r => masuk.has(r.kln) && r.brg === brg).forEach(r => dem.set(r.kln, (dem.get(r.kln) || 0) + r.qty));
      const ids = [...dem.keys()].sort((a, b) => ((kById(a) || {}).prioritas || 99) - ((kById(b) || {}).prioritas || 99) || sortNama(kNama(a), kNama(b)));
      const D = jum(ids, k => dem.get(k)), B = beli(per, brg), alok = new Map();
      if (B >= D) ids.forEach(k => alok.set(k, dem.get(k)));

      else {
        const q = ids.every(k => Number.isInteger(dem.get(k))) && Number.isInteger(B) ? 1 : 0.01; let pakai = 0;
        const dasar = ids.map(k => { const x = B * dem.get(k) / D, f = Math.floor(x / q + 1e-9) * q; pakai += f; return { k, f, frac: x - f }; });
        let sisa = Math.round((B - pakai) / q); dasar.sort((a, b) => b.frac - a.frac).forEach(d => { if (sisa > 0 && d.frac > 1e-9) { d.f += q; sisa--; } });

  }

  /* ---------- alokasi biaya operasional ---------- */

  /* ---------- halaman ---------- */
  const PAGES = {};
  const perlu = fn => () => P() ? fn(P()) : `<div class="card"><h3>Belum ada periode</h3><p>Semua kegiatan bulanan terikat ke satu periode (satu bulan). Buat periode dulu.</p><button class="cta" data-a="periodeBaru">+ Buat periode</button> <button class="btn" data-a="contoh">Muat data contoh Oktober 2026</button></div>`;

  };
  function renderBar() {

  /* Beranda */
  PAGES.dashboard = perlu(p => {
    const per = p.id, pg = DB.pengajuan[per], cek = cekAnggaran(per), real = totReal(per), ops = totOps(per), tr = transferP(per), sisa = tr - real - ops;
    const w = [];

  });

  /* Pengajuan */
  const kopHTML = () => `<img class="kop" src="../aset/kop-surat.png" alt="PT. Ray Mitra Perkasa">`;

  PAGES.pengajuan = perlu(p => {

    return `${kepala('Pengajuan ke Pimpinan', `<button class="btn" data-a="cetakPengajuan">Cetak / PDF dokumen</button>`)}${kartuAtas}

  function parseCSV(t) {
    const baris = t.replace(/^﻿/, '').split(/\r?\n/).filter(x => x.trim()); if (!baris.length) return [];
    const d = ['\t', ';', ','].map(c => [c, (baris[0].match(new RegExp(c === '\t' ? '\t' : '\\' + c, 'g')) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    return baris.map(l => { const o = []; let cur = '', q = false; for (let i = 0; i < l.length; i++) { const c = l[i]; if (q) { if (c === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; } else if (c === '"') q = true; else if (c === d) { o.push(cur.trim()); cur = ''; } else cur += c; } o.push(cur.trim()); return o; });
  }
  const norm = s => String(s).toLowerCase().replace(/[^a-z]/g, '');
  const ALIAS = { nama: ['nama', 'namaklien', 'namabarang', 'namatoko', 'klien', 'barang', 'toko'], lokasi: ['lokasi', 'namalokasi'], alamat: ['alamat'], pic: ['pic'], kontak: ['kontak', 'telepon', 'hp'], anggaran: ['anggaran', 'anggaranbulanan', 'anggaranperbulan'], wilayah: ['wilayah', 'rute'], satuan: ['satuan'], kategori: ['kategori'], harga: ['harga', 'hargareferensi', 'hargaref'], toko: ['toko', 'tokoutama', 'tokolangganan'], catatan: ['catatan', 'keterangan'], klien: ['klien', 'namaklien', 'lokasi'], barang: ['barang', 'namabarang', 'nama'], qty: ['qty', 'jumlah', 'jml'] };
  const KOLOM = { klien: ['nama', 'lokasi', 'alamat', 'pic', 'kontak', 'anggaran', 'wilayah'], barang: ['nama', 'satuan', 'kategori', 'harga', 'toko'], toko: ['nama', 'catatan'], permintaan: ['klien', 'barang', 'qty', 'satuan', 'catatan'] };
  const angka = (s, uang) => { s = String(s || '').trim(); if (!s) return 0; if (uang) return parseInt(s.replace(/[^\d-]/g, ''), 10) || 0; return parseFloat(s.replace(/\./g, m => /^\d{1,3}(\.\d{3})+$/.test(s) ? '' : m).replace(',', '.')) || 0; };
  function petaKolom(baris, jenis) {

    const m = new Map(); d.permintaan.forEach(r => m.set(r.brg, (m.get(r.brg) || 0) + r.qty));

    const items = [...m.entries()].map(([b, qty]) => ({ brg: b, qty, harga: B[brg.indexOf(b)][2], toko: toko[B[brg.indexOf(b)][3]], status: 'DISETUJUI', qtyS: qty }));
    d.pengajuan[per] = { nomor: '041/ADM/RAYMP/X/2026', tgl: '2026-10-28', keputusan: 'DISETUJUI', catatan: 'Setuju via chat.', tglSetuju: '2026-10-29', transfer: { tgl: '2026-10-30', nominal: 25950500, rek: 'Rekening operasional (contoh)' }, items, klien: kl.slice() };
    /* realisasi: harga aktual sedikit berbeda; pewangi lantai terbeli 90% (supaya contoh alokasi proporsional); baris terakhir disesuaikan agar total tepat Rp24.388.950 */
    const naik = [1.02, 1.05, 0.98, 1.0, 1.04, 1.0, 1.06, 1.0];

    kl.forEach((k, i) => d.distribusi.push({ id: nid('DST', 4), per, kln: k, status: i === 5 ? 'TERKIRIM' : 'DITERIMA', tgl: '2026-11-0' + (1 + (i % 3)), metode: 'Mobil sendiri', penerima: 'Penerima Contoh', bukti: '', rute: K[i][2], cat: '' }));
    d.log.push({ w: new Date().toISOString(), u: 'Admin', aksi: 'contoh', tabel: 'SEMUA', id: '', r: 'Data contoh dimuat' });
    return d;
