<style>
  :root { --bg:#EDF1F6; --panel:#FFFFFF; --panel2:#EEF2F7; --stroke:#DCE3EC; --text:#0F172A; --muted:#5B6577; --accent:#2F7F79; --ok:#3F7F6B; --ok-bg:#E5F1EC; --warn:#9A7432; --warn-bg:#F7EFDC; --bad:#B0584F; --bad-bg:#F8E7E4; --info:#4B8F9E; --navy:#33475B; --head:"IBM Plex Sans", system-ui, sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; } button { cursor:pointer; }
  h1, h2, h3 { margin:0; letter-spacing:-.01em; font-family:var(--head); }

  [hidden] { display:none !important; }
  .kop { display:flex; flex-direction:column; gap:2px; margin-bottom:14px; }
  .kop h1 { font-size:clamp(1.2rem, 2.4vw, 1.8rem); } .kop .perusahaan { color:var(--accent); font-weight:700; letter-spacing:.14em; font-size:.95rem; }
  body.dalam .kop, body.dalam .tabs { display:none; } body.dalam { background:transparent; } body.dalam .wrap { padding-top:6px; }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; }
  .tabs button { flex:none; border:1px solid var(--stroke); background:#fff; border-radius:99px; padding:7px 14px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:12px 16px; margin-bottom:16px; }
  .bar select { width:auto; min-width:170px; font-weight:600; }
  .bar .langkah { flex:1 1 280px; font-size:.9rem; } .bar .langkah b { color:var(--accent); }
  .ph { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px; margin:4px 0 14px; } .ph h2 { font-size:1.4rem; } .ph .aks { display:flex; flex-wrap:wrap; gap:8px; }
  .card { background:#fff; border:1px solid var(--stroke); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 18px rgba(15,23,42,.05); }
  .card h3 { font-size:1.05rem; margin-bottom:10px; } .card > p:first-of-type { margin-top:0; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }
  .kpi > div { background:#F4F7FB; border:1px solid var(--stroke); border-radius:14px; padding:12px 16px; } .kpi small { display:block; } .kpi b { display:block; font-size:1.3rem; margin:2px 0; } .kpi em { font-style:normal; font-size:.78rem; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:980px) { .grid2 { grid-template-columns:1fr; } }
  input, select, textarea { width:100%; background:#fff; border:1px solid #CBD5E1; border-radius:10px; padding:8px 11px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid rgba(47,127,121,.6); outline-offset:1px; }
  input[type=checkbox] { width:auto; }
  .btn, .cta { border:1px solid #CBD5E1; background:#fff; border-radius:10px; padding:8px 14px; } .btn:hover { border-color:var(--accent); color:var(--accent); }
  .cta { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; } .cta:hover { background:#26665F; border-color:#26665F; color:#fff; } .cta:disabled, .btn:disabled { opacity:.5; cursor:default; }
  .btn.mini { padding:3px 10px; font-size:.82rem; border-radius:8px; } .btn.bahaya:hover { border-color:var(--bad); color:var(--bad); }
  .chip { display:inline-block; border:1px solid var(--stroke); background:#fff; border-radius:99px; padding:4px 12px; font-size:.84rem; } button.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .lencana { display:inline-block; border-radius:99px; padding:2px 10px; font-size:.76rem; font-weight:600; background:var(--panel2); color:var(--muted); white-space:nowrap; }
  .lencana.ok { background:var(--ok-bg); color:var(--ok); } .lencana.warn { background:var(--warn-bg); color:var(--warn); } .lencana.bad { background:var(--bad-bg); color:var(--bad); } .lencana.info { background:#E1F0F4; color:#2E6E7C; }
  .subtabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tw { overflow-x:auto; } table.tbl { width:100%; border-collapse:collapse; font-size:.9rem; }
  .tbl th { background:var(--navy); color:#fff; text-align:left; font-weight:600; padding:8px 10px; white-space:nowrap; cursor:pointer; user-select:none; } .tbl th.r { text-align:right; }
  .tbl td { padding:8px 10px; border-bottom:1px solid #E5EAF1; vertical-align:top; } .tbl tbody tr:hover td { background:#F4F7FB; } .tbl tr.batal td { color:#9AA3B2; text-decoration:line-through; } .tbl tfoot td { font-weight:700; background:#F4F7FB; }
  .tbl select, .tbl input { padding:4px 8px; font-size:.88rem; } .tbl td input[type=number] { width:96px; text-align:right; }
  .cari { max-width:320px; margin-bottom:10px; }
  .peringatan { border-radius:12px; padding:10px 14px; margin-bottom:10px; background:var(--warn-bg); color:#6F5420; } .peringatan.bad { background:var(--bad-bg); color:#8A3B33; } .peringatan.ok { background:var(--ok-bg); color:#2D6350; }
  .peringatan ul { margin:4px 0 0; padding-left:20px; }
  .prog { height:12px; background:#E2E8F0; border-radius:99px; overflow:hidden; } .prog > i { display:block; height:100%; background:var(--accent); }
  .tren { display:grid; grid-template-columns:110px 1fr 130px; gap:6px 10px; align-items:center; font-size:.88rem; }
  .langkahs { display:flex; flex-wrap:wrap; gap:6px; } .langkahs span { padding:4px 10px; border-radius:8px; font-size:.78rem; background:var(--panel2); color:var(--muted); } .langkahs span.lalu { background:var(--ok-bg); color:var(--ok); } .langkahs span.kini { background:var(--accent); color:#fff; font-weight:600; }
  .toko { margin-bottom:14px; } .toko > h4 { margin:0 0 6px; font-size:.98rem; }
  details.kl { border:1px solid var(--stroke); border-radius:12px; padding:8px 14px; margin-bottom:8px; background:#fff; } details.kl summary { cursor:pointer; font-weight:600; }
  dialog { border:0; border-radius:18px; padding:0; width:min(560px, 94vw); box-shadow:0 20px 60px rgba(15,23,42,.35); } dialog::backdrop { background:rgba(15,23,42,.45); }
  .fm { padding:20px 22px; max-height:88vh; overflow:auto; } .fg { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; margin-top:12px; } .fg .w2 { grid-column:1 / -1; } @media (max-width:520px) { .fg { grid-template-columns:1fr; } }
  label.f { display:block; font-size:.8rem; color:var(--muted); margin-bottom:12px; } label.f > :is(input, select, textarea) { margin-top:4px; color:var(--text); } label.ck { display:flex; gap:8px; align-items:center; font-size:.9rem; color:var(--text); }
  .err { color:var(--bad); font-weight:600; min-height:1.2em; margin-top:4px; } .aks { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  #toast { position:fixed; right:16px; bottom:16px; z-index:50; display:flex; flex-direction:column; gap:8px; max-width:min(420px, 92vw); }
  #toast div { background:var(--navy); color:#fff; padding:10px 14px; border-radius:12px; box-shadow:0 8px 24px rgba(15,23,42,.3); } #toast div.bad { background:var(--bad); }
  #cetak { display:none; }
  .dok { font-family:"Times New Roman", serif; color:#000; font-size:12pt; line-height:1.4; } .dok img.kop { width:100%; margin-bottom:10px; } .dok h2 { text-align:center; font-size:14pt; margin:8px 0 2px; text-decoration:underline; } .dok .no { text-align:center; margin-bottom:12px; }
  .dok table { width:100%; border-collapse:collapse; margin:8px 0; font-size:11pt; } .dok th, .dok td { border:1px solid #000; padding:4px 6px; } .dok th { background:#eee; } .dok td.r, .dok th.r { text-align:right; }
  .dok .ttd { display:flex; justify-content:space-around; margin-top:28px; text-align:center; } .dok .ttd div { min-width:190px; } .dok .ttd .sp { height:70px; }
  .dok .hal { page-break-after:always; } .dok .hal:last-child { page-break-after:auto; } .dok .kv td { border:0; padding:1px 6px; }
  @media (max-width:860px) { .wrap { padding:12px 12px 64px; } .card { padding:14px; } .btn, .cta, input, select { min-height:44px; } .btn.mini { min-height:34px; } input, select, textarea { font-size:16px; } }
  @media print { body > :not(#cetak) { display:none !important; } #cetak { display:block !important; } body { background:#fff; } @page { size:A4; margin:14mm; } }

<script>
(() => {
  'use strict';
  const URL_ = 'https://vqcusagijiavaoljfrib.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxY3VzYWdpamlhdmFvbGpmcmliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTIzOTksImV4cCI6MjEwODA2ODM5OX0.VeslVR4UHv26LCMbkO7KP0k96r8lg7-NNLjY30iMyFk';
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const ALUR = ['FORM', 'REKAP', 'DIAJUKAN', 'DISETUJUI', 'BELANJA', 'PLOTING', 'PENGIRIMAN', 'DILAPORKAN'];
  const NAMA_ALUR = ['Form dibuka', 'Rekap', 'Pengajuan', 'Disetujui', 'Belanja', 'Ploting', 'Pengiriman', 'Dilaporkan'];
  const PAGES = ['beranda', 'periode', 'rekap', 'pengajuan', 'belanja', 'ploting', 'pengiriman', 'pengeluaran', 'laporan'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rp = n => 'Rp' + Math.round(Number(n) || 0).toLocaleString('id-ID');
  const ang = n => Math.round(Number(n) || 0).toLocaleString('id-ID');
  const jml = n => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
  const waktu = d => d ? new Date(d).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
  const label = p => BULAN[p.bulan - 1] + ' ' + p.tahun;
  const S = { page: 'beranda', pid: null, master: null, rekap: null, info: null, biaya: [], lok: null, sub: 'lokasi', pengecualian: {} };
  const kunciPid = 'chemical.periode';

  // ---------- panggilan server ----------
  async function rpc(fn, body) {
    const r = await fetch(URL_ + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || 'Gagal (' + r.status + ')'); e.login = /login admin diperlukan/.test(j.message || ''); throw e; }
    return j;
  }
  async function admin(fn, body) { await Masuk.wajib(); return rpc(fn, body); }
  function pesan(t, bad) { const d = document.createElement('div'); d.textContent = t; if (bad) d.className = 'bad'; $('toast').appendChild(d); setTimeout(() => d.remove(), bad ? 7000 : 3200); }
  const aksi = async (fn, body, ok) => { try { const r = await admin(fn, body); if (ok) pesan(ok); return r; } catch (e) { pesan(e.message, true); throw e; } };

  // ---------- pemuatan data ----------
  const periodeAktif = () => (S.master ? S.master.periode : []).find(p => p.id === S.pid) || null;
  const terkunci = () => { const p = periodeAktif(); return !p || !['FORM', 'REKAP'].includes(p.status); };
  async function muatMaster() { S.master = await admin('chemical_master'); const ps = S.master.periode; if (!ps.find(p => p.id === S.pid)) { let s = null; try { s = +localStorage.getItem(kunciPid); } catch (e) {} S.pid = (ps.find(p => p.id === s) || ps[ps.length - 1] || {}).id || null; } }
  async function muatPeriode() {
    S.rekap = S.info = null; S.biaya = [];
    if (!S.pid) return;
    S.rekap = await admin('chemical_rekap_data', { p_periode: S.pid });
    if (['pengajuan', 'beranda'].includes(S.page)) { S.info = await admin('chemical_pengajuan_info', { p_periode: S.pid }); S.biaya = await admin('chemical_daftar_biaya', { p_periode: S.pid }); }
  }
  async function segarkan(master) { try { if (master) await muatMaster(); await muatPeriode(); render(); } catch (e) { galatLayar(e); } }
  function galatLayar(e) {
    $('main').innerHTML = `<div class="card"><h3>${e.login ? 'Perlu masuk sebagai admin' : 'Gagal memuat data'}</h3><p class="muted">${esc(e.message)}</p><button class="cta" data-a="muat">${e.login ? 'Masuk' : 'Coba lagi'}</button></div>`;
  }

  // ---------- perhitungan ----------
  const barisLok = id => (S.rekap ? S.rekap.baris : []).filter(b => b.lokasi_id === id);
  const jualLok = id => barisLok(id).reduce((s, b) => s + (b.bebas ? 0 : b.qty * (b.harga_jual || 0)), 0);
  const adaBebas = id => barisLok(id).some(b => b.bebas);
  function anggaran(l) {
    const jual = jualLok(l.id), rab = l.rab_bulan, pct = rab ? jual / rab * 100 : 0;
    if (l.mode === 'tanpa_batas') return { t: 'TANPA BATAS', c: 'info', pct: 0, jual };
    return pct > 100 ? { t: 'LEWAT RAB', c: 'bad', pct, jual } : pct >= 90 ? { t: 'HAMPIR HABIS', c: 'warn', pct, jual } : { t: 'CUKUP', c: 'ok', pct, jual };
  }
  const MODE = { ketat: 'ketat (tidak boleh lewat)', persetujuan: 'boleh lewat dengan persetujuan', tanpa_batas: 'tanpa batas' };
  const stepper = st => { const i = ALUR.indexOf(st); return '<div class="alur">' + NAMA_ALUR.map((n, k) => `<div class="${k < i ? 'd' : k === i ? 'n' : ''}">${k + 1}. ${n}</div>`).join('') + '</div>'; };
  const tautForm = p => new URL('form.html?t=' + p.token, location.href).href;
  const tautSetuju = tk => new URL('setujui.html?t=' + tk, location.href).href;
  const wa = teks => 'https://wa.me/?text=' + encodeURIComponent(teks);
  async function salin(t) { try { await navigator.clipboard.writeText(t); pesan('Tautan disalin.'); } catch (e) { prompt('Salin tautan ini:', t); } }

  // ---------- bilah periode ----------
  function renderBar() {
    const ps = S.master ? S.master.periode.slice().reverse() : [], p = periodeAktif();
    $('bar').innerHTML = `<label class="kecil muted">Periode</label><select id="pilihPer">${ps.map(x => `<option value="${x.id}" ${x.id === S.pid ? 'selected' : ''}>${label(x)}</option>`).join('') || '<option>— belum ada periode —</option>'}</select>
      <button class="btn" data-a="periodeBaru">+ Periode baru</button>${p ? `<span class="lencana ${p.status === 'FORM' ? 'ok' : ''}">${NAMA_ALUR[ALUR.indexOf(p.status)] || p.status}</span>` : ''}
      <span class="langkah muted">${PAGES.map(k => `<button class="chip ${k === S.page ? 'on' : ''}" data-pg="${k}" style="margin:2px">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</span>`;
  }

  // ---------- halaman ----------
  const P = {};
  P.beranda = () => {
    const p = periodeAktif(); const ps = S.master.periode.slice().reverse();
    const lok = S.rekap ? S.rekap.lokasi.filter(l => l.aktif || l.kiriman) : [], isi = lok.filter(l => l.kiriman).length, cocok = lok.filter(l => l.kiriman && l.cocok).length;
    const langkah = !p ? 'Buat periode baru untuk memulai.' : ({ FORM: 'Sebarkan tautan form ke korlap, lalu tutup form bila sudah cukup.', REKAP: 'Cocokkan permintaan tiap lokasi di halaman Rekap, lalu susun pengajuan.', DIAJUKAN: 'Pengajuan menunggu keputusan pimpinan.', DISETUJUI: 'Disetujui. Belanja, ploting, dan pengiriman dikerjakan pada tahap berikutnya.' }[p.status] || 'Tahap ini dikerjakan pada pembaruan berikutnya.');
    return `<div class="ph"><h2>Beranda</h2></div>
      <div class="card"><h3>Langkah berikutnya</h3><p>${langkah}</p>${p ? `<button class="cta" data-pg="${p.status === 'FORM' ? 'periode' : p.status === 'REKAP' ? 'rekap' : 'pengajuan'}">${p.status === 'FORM' ? 'Ke Periode' : p.status === 'REKAP' ? 'Ke Rekap' : 'Ke Pengajuan'}</button>` : '<button class="cta" data-a="periodeBaru">+ Periode baru</button>'}</div>
      ${p ? `<div class="kpi"><div><small>Lokasi sudah mengisi</small><b>${isi} dari ${lok.length}</b></div><div><small>Lokasi cocok</small><b>${cocok} dari ${isi}</b></div><div><small>Baris barang</small><b>${S.rekap.baris.length}</b></div><div><small>Barang lain tanpa harga</small><b>${S.rekap.baris.filter(b => b.bebas).length}</b></div></div>` : ''}

    petakan: t => {
      const b = S.rekap.baris.find(x => x.id === +t.dataset.id), kat = S.master.barang.filter(x => x.aktif), tk = S.master.toko.filter(x => x.aktif);
      dialog(`<h3>Barang lain: ${esc(b.nama)}</h3><p class="muted kecil">${jml(b.qty)} ${esc(b.satuan)}. Pilih cara melengkapinya.</p>
        <label><input type="radio" name="mode" value="petakan" checked> Samakan dengan barang katalog</label><select name="item">${kat.map(x => `<option value="${x.id}">${esc(x.nama)} (${esc(x.toko)}, ${esc(x.satuan)})</option>`).join('')}</select>
        <label style="margin-top:10px"><input type="radio" name="mode" value="baru"> Buat barang katalog baru</label><select name="toko">${tk.map(x => `<option value="${x.id}">Toko ${esc(x.nama)}</option>`).join('')}</select>
        <div class="grid2"><div><label class="kecil">Harga beli</label><input name="beli" type="number" min="0" placeholder="0"></div><div><label class="kecil">Harga jual</label><input name="jual" type="number" min="0" placeholder="0"></div></div>`,
        async f => { if (f.mode.value === 'petakan') await aksi('chemical_petakan_bebas', { p_permintaan: b.id, p_item: +f.item.value }, 'Barang dipetakan.'); else await aksi('chemical_buat_item_dari_bebas', { p_permintaan: b.id, p_toko: +f.toko.value, p_beli: f.beli.value === '' ? null : +f.beli.value, p_jual: f.jual.value === '' ? null : +f.jual.value }, 'Barang baru dibuat dan dipetakan.'); await muatMaster(); await muatPeriode(); render(); });
    },
    tambahBiaya: async () => { const k = $('katBaru').value.trim(), e = $('estBaru').value; if (!k) return pesan('Isi kategori biaya.', true); await aksi('chemical_simpan_biaya', { p_id: null, p_periode: S.pid, p_kategori: k, p_estimasi: +e || 0, p_aktual: null, p_metode: 'proporsional', p_lokasi: null }, 'Biaya ditambahkan.'); segarkan(); },
    ajukan: async () => { if (!confirm('Ajukan ke pimpinan? Setelah diajukan, data rekap dan biaya dikunci sampai ada keputusan.')) return; await aksi('chemical_ajukan', { p_periode: S.pid, p_catatan: ($('catAjuan') || {}).value || null }, 'Pengajuan dibuat. Kirim tautan persetujuan ke pimpinan.'); segarkan(true); },
    tarik: async () => { if (!confirm('Tarik pengajuan ini? Tautan pimpinan tidak berlaku lagi.')) return; await aksi('chemical_tarik', { p_pengajuan: S.info.pengajuan.id }, 'Pengajuan ditarik.'); segarkan(true); },
    memo: () => memo(),
    tutupDlg: () => $('dlg').close()
  };

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-a],[data-pg],[data-sub],[data-lok],[data-pilih],[data-bukakembali],[data-hapusbiaya],[data-salin]'); if (!t) return;
    try {
      if (t.dataset.pg) return pindah(t.dataset.pg);
      if (t.dataset.sub) { S.sub = t.dataset.sub; return render(); }
      if (t.dataset.lok) { S.lok = +t.dataset.lok; return render(); }
      if (t.dataset.pilih) { S.pid = +t.dataset.pilih; try { localStorage.setItem(kunciPid, S.pid); } catch (x) {} S.page = 'periode'; return segarkan(); }
      if (t.dataset.salin) return salin(t.dataset.salin);
      if (t.dataset.bukakembali) { if (!confirm('Buka kembali ' + t.dataset.nm + '? Kiriman lokasi ini dihapus dan korlap bisa mengisi ulang.')) return; await aksi('chemical_buka_kembali', { p_kiriman: +t.dataset.bukakembali }, 'Lokasi dibuka kembali.'); return segarkan(); }
      if (t.dataset.hapusbiaya) { await aksi('chemical_hapus_biaya', { p_id: +t.dataset.hapusbiaya }, 'Biaya dihapus.'); return segarkan(); }
      if (t.dataset.a && A[t.dataset.a]) await A[t.dataset.a](t);
    } catch (x) { /* pesan sudah ditampilkan oleh aksi() */ }
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    try {
      if (t.id === 'pilihPer') { S.pid = +t.value; try { localStorage.setItem(kunciPid, S.pid); } catch (x) {} return segarkan(); }
      if (t.dataset.qty) { await aksi('chemical_ubah_qty', { p_permintaan: +t.dataset.qty, p_qty: +t.value || 0 }, 'Jumlah diubah.'); return segarkan(); }
      if (t.dataset.biaya) { const b = S.biaya.find(x => x.id === +t.dataset.biaya); await aksi('chemical_simpan_biaya', { p_id: b.id, p_periode: S.pid, p_kategori: b.kategori, p_estimasi: +t.value || 0, p_aktual: b.aktual, p_metode: b.metode, p_lokasi: b.lokasi_id }, 'Biaya disimpan.'); return segarkan(); }
      if (t.id === 'lewatRab') S.pengecualian[S.lok] = t.checked;
    } catch (x) { segarkan(); }
  });

  // ---------- memo cetak ----------
  function memo() {
    const p = periodeAktif(), I = S.info, g = I.pengajuan, R = g && ['MENUNGGU', 'DISETUJUI'].includes(g.status) ? g.rincian : I.rincian, kop = new URL('../aset/kop-surat.png', location.href).href, kaki = new URL('../aset/kaki-surat.png', location.href).href;
    const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }), lewat = R.lokasi.filter(l => l.lewat_rab);
    const stat = l => l.mode === 'tanpa_batas' ? 'Tanpa batas' : l.jual > l.rab ? 'Lewat RAB' : l.jual / l.rab >= .9 ? 'Hampir habis' : 'Cukup';
    const no = 'CHEM/' + p.tahun + '/' + String(p.bulan).padStart(2, '0') + (g ? '/' + g.ke : '');
    const halaman = (isi) => `<div class="memo"><img class="kop" src="${kop}">${isi}<img class="kaki" src="${kaki}"></div>`;
    const h1 = `<h2>MEMO PENGAJUAN ANGGARAN BELANJA CHEMICAL</h2><div class="no2">No. ${no}</div>
      <table class="meta"><tr><td style="width:24mm">Kepada</td><td>: Direktur dan Direktur Utama</td></tr><tr><td>Dari</td><td>: PIC Pengadaan</td></tr><tr><td>Tanggal</td><td>: ${tgl}</td></tr><tr><td>Perihal</td><td>: Pengajuan dana belanja chemical periode ${label(p)}</td></tr></table>
      <p>Bersama ini kami mengajukan dana belanja chemical dan perlengkapan kebersihan untuk ${R.lokasi.length} lokasi dengan rincian berikut:</p>
      <table><tr><th style="width:9mm">No</th><th>Uraian</th><th class="r" style="width:36mm">Jumlah (Rp)</th></tr>${R.toko.map((t, i) => `<tr><td>${i + 1}</td><td>Belanja Toko ${esc(t.toko)}</td><td class="r">${ang(t.total)}</td></tr>`).join('')}<tr class="tot"><td></td><td>Subtotal belanja</td><td class="r">${ang(R.beli)}</td></tr>${R.ops.map((o, i) => `<tr><td>${R.toko.length + i + 1}</td><td>${esc(o.kategori)}</td><td class="r">${ang(o.estimasi)}</td></tr>`).join('')}<tr class="tot"><td></td><td>Subtotal biaya operasional (estimasi)</td><td class="r">${ang(R.ops_total)}</td></tr><tr class="tot"><td></td><td>TOTAL DANA DIAJUKAN</td><td class="r">${ang(R.total)}</td></tr></table>
      <p style="margin:8px 0 3px"><b>Rekap permintaan terhadap anggaran lokasi</b></p><table><tr><th>Lokasi</th><th class="r">Permintaan (harga jual)</th><th class="r">RAB per bulan</th><th class="r">%</th><th>Status</th></tr>${R.lokasi.map(l => `<tr><td>${esc(l.lokasi)}</td><td class="r">${ang(l.jual)}</td><td class="r">${l.mode === 'tanpa_batas' ? 'tanpa batas' : ang(l.rab)}</td><td class="r">${l.mode === 'tanpa_batas' ? '–' : Math.round(l.jual / l.rab * 100) + '%'}</td><td>${stat({ ...l })}${l.lewat_rab ? ' (pengecualian)' : ''}</td></tr>`).join('')}</table>
      ${lewat.length ? `<p><i>Catatan:</i> ${lewat.map(l => esc(l.lokasi) + ' melebihi RAB sebesar ' + rp(l.jual - l.rab)).join('; ')}, diajukan sebagai pengecualian sesuai kebijakan lokasi.</p>` : ''}${g && g.catatan ? `<p><i>${esc(g.catatan)}</i></p>` : ''}
      <p>Demikian kami sampaikan, mohon persetujuan Bapak. Terima kasih.</p>
      <div class="ttd"><div>Dibuat oleh,<div class="gb"></div><b>PIC Pengadaan</b></div><div>Menyetujui,<div class="gb">${g && g.status_yasir === 'SETUJU' ? '<i>disetujui digital ' + waktu(g.waktu_yasir) + '</i>' : ''}</div><b>Direktur</b></div><div>Menyetujui,<div class="gb">${g && g.status_ferry === 'SETUJU' ? '<i>disetujui digital ' + waktu(g.waktu_ferry) + '</i>' : ''}</div><b>Direktur Utama</b></div></div>`;
    // lampiran: daftar belanja per toko (jumlah dari rekap)
    const per = new Map(); (S.rekap.baris || []).filter(b => !b.bebas).forEach(b => { const o = per.get(b.item_id) || { b, qty: 0 }; o.qty += b.qty; per.set(b.item_id, o); });
    const tk = new Map(); [...per.values()].forEach(o => { (tk.get(o.b.toko) || tk.set(o.b.toko, []).get(o.b.toko)).push(o); });
    const h2 = `<h2>LAMPIRAN — DAFTAR BELANJA PER TOKO</h2><div class="no2">Periode ${label(p)} · centang kolom ✓ saat barang terbeli</div>${[...tk].sort((a, b) => a[0].localeCompare(b[0])).map(([t, os]) => `<p style="margin:8px 0 3px"><b>Toko ${esc(t)}</b></p><table><tr><th style="width:8mm">✓</th><th>Barang</th><th>Sat.</th><th class="r">Jumlah</th><th class="r">Harga est.</th><th class="r">Subtotal</th></tr>${os.sort((a, b) => a.b.nama.localeCompare(b.b.nama)).map(o => `<tr><td>☐</td><td>${esc(o.b.nama)}</td><td>${esc(o.b.satuan)}</td><td class="r">${jml(o.qty)}</td><td class="r">${ang(o.b.harga_beli)}</td><td class="r">${ang(o.qty * o.b.harga_beli)}</td></tr>`).join('')}<tr class="tot"><td colspan="5">Jumlah Toko ${esc(t)}</td><td class="r">${ang(os.reduce((s, o) => s + o.qty * o.b.harga_beli, 0))}</td></tr></table>`).join('')}`;
    $('cetakMemo').innerHTML = halaman(h1) + halaman(h2);
    const imgs = [...$('cetakMemo').querySelectorAll('img')]; Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => window.print());
  }
  window.addEventListener('afterprint', () => { $('cetakMemo').innerHTML = ''; });
  window.addEventListener('hashchange', () => pindah(location.hash.slice(1)));
  if (window.top !== window.self) document.body.classList.add('dalam');
  (async () => { S.page = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'beranda'; try { await muatMaster(); await muatPeriode(); render(); } catch (e) { renderBar(); galatLayar(e); } })();
})();
</script>
</body>
</html>
